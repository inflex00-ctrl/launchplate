<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#0b0d0e;color:#eceeef;
  padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 100% at 12% 0%,rgba(63,191,164,.20),transparent 62%),
             radial-gradient(50% 80% at 100% 100%,rgba(224,134,76,.10),transparent 60%);}
body::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,#262b2f 1px,transparent 0);
  background-size:32px 32px;opacity:.55;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 20% 10%,#000 10%,transparent 70%);}
.wrap{position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:660;letter-spacing:-.03em}
.mark{width:46px;height:46px;color:#3fbfa4}
h1{font-size:66px;line-height:1.06;letter-spacing:-.04em;font-weight:660;color:#fff;max-width:16ch;margin-top:52px}
p{font-size:25px;line-height:1.5;color:#a3abb2;max-width:36ch;margin-top:22px;letter-spacing:-.01em}
.foot{display:flex;align-items:center;gap:22px;position:relative;z-index:2}
.chip{border:1px solid #262b2f;background:#121517;border-radius:999px;padding:11px 22px;font-size:20px;color:#a3abb2;font-weight:520}
.chip b{color:#3fbfa4;font-weight:640}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="currentColor" fill-opacity=".14"/><path d="M10 23V9.5l12 13V9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Northwind</span>
  </div>
  <h1>Know which account to call before the renewal call.</h1>
  <p>Product usage, billing and support in one account timeline — with the next action attached.</p>
</div>
<div class="foot">
  <span class="chip"><b>14 days</b> free</span>
  <span class="chip">No credit card</span>
  <span class="chip">Live in an afternoon</span>
</div>
</body></html>
